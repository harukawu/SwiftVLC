name: Sanitizers

# Sanitizer runs are slower than the regular test job (TSan instruments
# every memory access, ~3-5x slowdown; ASan ~2x slowdown), so they run
# only on PRs that touch concurrency-sensitive code, on push to main,
# or weekly to catch regressions in dependencies. This fork ships an
# iOS-only dynamic libVLC artifact, so sanitizers run through xcodebuild
# on an iOS Simulator rather than host `swift test`.
#
# Scoped to the race/lifecycle/memory test suites — these are the suites
# that exist *because* of races. Running the full test suite under
# sanitizers would inflate CI minutes without proportional benefit.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Sources/SwiftVLC/Player/**'
      - 'Sources/SwiftVLC/PiP/**'
      - 'Sources/SwiftVLC/Core/**'
      - 'Sources/SwiftVLC/Media/Media.swift'
      - 'Sources/SwiftVLC/Media/ThumbnailRequest.swift'
      - 'Sources/SwiftVLC/Discovery/**'
      - 'Sources/SwiftVLC/Playlist/**'
      - 'Sources/SwiftVLC/Audio/Equalizer.swift'
      - 'Sources/SwiftVLC/Video/VideoView.swift'
      - 'Tests/SwiftVLCTests/**Race**'
      - 'Tests/SwiftVLCTests/**Stress**'
      - 'Tests/SwiftVLCTests/**Memory**'
      - 'Tests/SwiftVLCTests/**Lifecycle**'
      - 'Package.swift'
      - '.github/workflows/sanitize.yml'
  schedule:
    # Weekly run on Monday 03:00 UTC catches sanitizer regressions in
    # libVLC, Swift toolchain, or transitive deps even when no PR opens.
    - cron: '0 3 * * 1'

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: thread
            xcodebuild_arg: "-enableThreadSanitizer YES"
          - sanitizer: address
            xcodebuild_arg: "-enableAddressSanitizer YES"
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 2

      - uses: maxim-lobanov/setup-xcode@v1
        timeout-minutes: 5
        with:
          xcode-version: "26.4"

      - name: Print toolchain
        timeout-minutes: 1
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Cache libvlc xcframework
        uses: actions/cache@v5
        timeout-minutes: 5
        with:
          path: Vendor
          key: libvlc-xcf-vendor-${{ hashFiles('Package.swift') }}
          enableCrossOsArchive: false

      - name: Set up Vendor + local Swift package
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/setup-dev.sh

      - name: Run sanitized iOS tests
        timeout-minutes: 35
        env:
          TEST_RUNNER_CI: "true"
        run: |
          xcodebuild test \
            -scheme SwiftVLC \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -configuration Debug \
            ${{ matrix.xcodebuild_arg }} \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
